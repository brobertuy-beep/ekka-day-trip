<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>🎡 A day out on EKKA Show Day?</title>
<meta name="description" content="A little fairground invitation — will you come on a day trip on Brisbane EKKA Show Day?" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#2b1b45" />
<meta property="og:title" content="🎡 A day out on EKKA Show Day?" />
<meta property="og:description" content="Tap to open your ride ticket…" />
<style>
  :root{
    color-scheme: dark;
    --plum:#2b1b45; --plum2:#4a2a63; --plum3:#1c1230;
    --red:#e8384f; --red-deep:#b31f36;
    --pink:#ff8fb1;
    --gold:#ffcb47; --gold-deep:#e0a41f;
    --cream:#fff6ec; --cream2:#ffe9d2;
    --ink:#33223a; --ink-soft:#6a5566;
    --line:#3a2657;
    --good:#39c47b;
    --disp:"Arial Narrow","Helvetica Neue Condensed",system-ui,sans-serif;
    --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --shadow:0 18px 40px rgba(12,6,26,.5);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;overflow-x:hidden}
  body{
    min-height:100dvh;
    font-family:var(--body);
    color:var(--cream);
    background:
      radial-gradient(120% 80% at 50% -10%, #6a3d84 0%, transparent 55%),
      radial-gradient(90% 60% at 85% 110%, #7a2450 0%, transparent 50%),
      linear-gradient(180deg,var(--plum) 0%, var(--plum3) 100%);
    background-attachment:fixed;
    display:flex; align-items:flex-start; justify-content:center;
    padding:22px 14px 40px;
    padding-left:max(14px, env(safe-area-inset-left));
    padding-right:max(14px, env(safe-area-inset-right));
    padding-bottom:max(30px, env(safe-area-inset-bottom));
  }
  /* twinkling starfield / distant fair lights */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
    background-image:
      radial-gradient(1.4px 1.4px at 12% 22%, #ffe6a3 60%, transparent),
      radial-gradient(1.2px 1.2px at 78% 14%, #ffd0e0 60%, transparent),
      radial-gradient(1.6px 1.6px at 40% 8%,  #fff 60%, transparent),
      radial-gradient(1.2px 1.2px at 62% 30%, #ffe6a3 60%, transparent),
      radial-gradient(1.3px 1.3px at 90% 40%, #fff 60%, transparent),
      radial-gradient(1.2px 1.2px at 22% 42%, #ffd0e0 60%, transparent);
    animation:twinkle 4s ease-in-out infinite alternate;
  }
  @keyframes twinkle{from{opacity:.28}to{opacity:.6}}

  .wrap{position:relative; z-index:1; width:100%; max-width:460px}

  /* ---------- the ticket ---------- */
  .ticket{
    position:relative;
    background:linear-gradient(180deg,var(--cream) 0%, var(--cream2) 100%);
    color:var(--ink);
    border-radius:22px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  /* perforation notches on the sides */
  .ticket::before, .ticket::after{
    content:""; position:absolute; top:96px; width:26px; height:26px;
    background:var(--plum3); border-radius:50%;
  }
  .ticket::before{left:-13px}
  .ticket::after{right:-13px}

  /* marquee of bulbs across the header */
  .marquee{
    position:relative;
    background:linear-gradient(180deg,var(--red) 0%, var(--red-deep) 100%);
    color:#fff; padding:20px 18px 18px; text-align:center;
    border-bottom:3px dashed rgba(255,255,255,.55);
  }
  .bulbs{position:absolute; top:7px; left:0; right:0; height:12px; display:flex; justify-content:space-around; padding:0 10px}
  .bulbs i{
    width:9px; height:9px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, var(--gold) 60%, var(--gold-deep));
    box-shadow:0 0 7px 2px rgba(255,203,71,.8);
    animation:blink 1.4s ease-in-out infinite;
  }
  .bulbs i:nth-child(odd){animation-delay:.7s; background:radial-gradient(circle at 35% 30%, #fff, var(--pink) 60%, #d95c86); box-shadow:0 0 7px 2px rgba(255,143,177,.75)}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.32}}

  .kicker{
    font-family:var(--disp); font-weight:700; letter-spacing:.26em; text-transform:uppercase;
    font-size:.72rem; opacity:.95; margin:8px 0 0;
  }
  .marquee h1{
    font-family:var(--disp); font-weight:700; text-transform:uppercase;
    letter-spacing:.01em; line-height:.94; text-wrap:balance;
    font-size:clamp(1.9rem, 8.5vw, 2.7rem); margin:6px 4px 2px;
    text-shadow:0 2px 0 var(--red-deep);
  }
  .marquee .sub{font-size:.9rem; opacity:.92; margin:6px 0 2px}

  /* body / stub */
  .stub{padding:22px 20px 24px; min-height:230px; display:flex; flex-direction:column}
  .steplabel{
    font-family:var(--disp); font-weight:700; letter-spacing:.22em; text-transform:uppercase;
    font-size:.66rem; color:var(--red-deep); margin:0 0 4px;
  }
  .q{
    font-family:var(--disp); font-weight:700; text-transform:uppercase; letter-spacing:.005em;
    line-height:1.02; font-size:clamp(1.35rem, 5.6vw, 1.7rem); color:var(--ink);
    margin:0 0 4px; text-wrap:balance;
  }
  .hint{font-size:.92rem; color:var(--ink-soft); margin:2px 0 14px; line-height:1.4}

  /* progress lights */
  .progress{display:flex; gap:6px; align-items:center; padding:14px 20px 0}
  .progress i{height:6px; flex:1; border-radius:99px; background:rgba(51,34,58,.14)}
  .progress i.on{background:linear-gradient(90deg,var(--red),var(--pink))}

  /* controls */
  .field{width:100%}
  input[type=email], input[type=text], input[type=date], textarea{
    width:100%; font:inherit; color:var(--ink);
    background:#fff; border:2px solid #e7d8c6; border-radius:12px;
    padding:13px 14px; outline:none; -webkit-appearance:none;
  }
  input:focus, textarea:focus{border-color:var(--red); box-shadow:0 0 0 3px rgba(232,56,79,.16)}
  textarea{min-height:92px; resize:vertical}
  ::placeholder{color:#b7a894}

  .opts{display:flex; flex-direction:column; gap:10px}
  .opt{
    display:flex; align-items:center; gap:12px; cursor:pointer;
    background:#fff; border:2px solid #ecdccb; border-radius:14px; padding:13px 14px;
    font-size:1.02rem; color:var(--ink); transition:border-color .12s, background .12s, transform .05s;
    user-select:none;
  }
  .opt .em{font-size:1.25rem; line-height:1; width:26px; text-align:center}
  .opt:active{transform:scale(.99)}
  .opt.sel{border-color:var(--red); background:#fff2f4}
  .opt.sel::after{content:"✓"; margin-left:auto; color:var(--red); font-weight:800}
  .opt.disabled{opacity:.42; pointer-events:none}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  @media (max-width:360px){.grid2{grid-template-columns:1fr}}

  .nav{display:flex; gap:10px; margin-top:auto; padding-top:18px; align-items:center}
  .btn{
    font:inherit; font-weight:700; border:none; border-radius:14px; padding:14px 18px;
    cursor:pointer; letter-spacing:.01em; transition:transform .06s, box-shadow .12s, filter .12s;
  }
  .btn:active{transform:translateY(1px)}
  .btn-primary{
    background:linear-gradient(180deg,var(--red),var(--red-deep)); color:#fff; flex:1;
    box-shadow:0 6px 0 #8a1729;
  }
  .btn-primary:disabled{filter:grayscale(.5) opacity(.6); box-shadow:0 6px 0 #8a1729; cursor:not-allowed}
  .btn-ghost{
    background:transparent; color:var(--ink-soft); border:2px solid #e2d3c2; padding:12px 14px;
  }
  .btn-gold{background:linear-gradient(180deg,var(--gold),var(--gold-deep)); color:#4a2f00; box-shadow:0 6px 0 #a9760f}

  /* the big ask + runaway NO */
  .ask{text-align:center}
  .ask .yesno{position:relative; display:flex; gap:14px; justify-content:center; margin-top:22px; min-height:64px; flex-wrap:wrap}
  #yesBtn{
    background:linear-gradient(180deg,var(--good),#219a5c); color:#fff; box-shadow:0 6px 0 #157243;
    font-size:1.15rem; padding:16px 30px; border-radius:16px; border:none; font-weight:800; cursor:pointer;
    transition:transform .1s;
  }
  #noBtn{
    background:#fff; color:var(--ink-soft); border:2px solid #e2d3c2; border-radius:16px;
    font-size:1.05rem; padding:16px 26px; font-weight:700; cursor:pointer;
  }
  #noBtn.loose{position:fixed; z-index:40; margin:0; transition:top .18s ease, left .18s ease}

  .reminders{list-style:none; margin:6px 0 0; padding:0; display:flex; flex-direction:column; gap:12px}
  .reminders li{
    background:#fff; border:2px dashed #eccdb6; border-radius:14px; padding:13px 14px 13px 46px;
    position:relative; font-size:1rem; color:var(--ink); line-height:1.42;
  }
  .reminders li .em{position:absolute; left:12px; top:12px; font-size:1.3rem}
  .reminders small{display:block; color:var(--ink-soft); margin-top:5px; font-size:.86rem}

  .foot{ text-align:center; color:rgba(255,255,255,.62); font-size:.78rem; margin:16px 6px 0; line-height:1.5 }
  .foot b{color:var(--pink)}

  /* confetti */
  .confetti{position:fixed; top:-12px; width:10px; height:14px; z-index:60; pointer-events:none; border-radius:2px}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important}
    #noBtn.loose{transition:none}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="ticket" role="group" aria-label="Day trip invitation">
      <div class="marquee">
        <div class="bulbs" aria-hidden="true"></div>
        <p class="kicker">Admit two · Royal Queensland Show</p>
        <h1 id="title">EKKA Show&nbsp;Day</h1>
        <p class="sub" id="subtitle">One ride ticket, made just for you 🎡</p>
      </div>

      <div class="progress" id="progress" aria-hidden="true"></div>

      <div class="stub" id="stub"><!-- steps render here --></div>
    </div>
    <p class="foot">Made with a bit of fairy floss for <b id="footname">you</b> · view it anywhere, even on your phone 📱</p>
  </div>

<script>
(function(){
  "use strict";

  /* ---------- invitee name from the URL (?name= or ?to=) ---------- */
  var params = new URLSearchParams(location.search);
  function titleCase(s){ return s.replace(/\b\w/g, function(c){return c.toUpperCase();}); }
  var rawName = (params.get("name") || params.get("to") || "").trim();
  var NAME = rawName ? titleCase(rawName.replace(/[<>]/g,"").slice(0,40)) : "";
  var HOST_EMAIL = "brobert.uy@gmail.com";   // where answers land + who gets the calendar invite

  document.getElementById("subtitle").textContent = NAME ? ("One ride ticket, made just for " + NAME + " 🎡") : "One ride ticket, made just for you 🎡";
  document.getElementById("footname").textContent = NAME || "you";
  if (NAME) document.title = "🎡 " + NAME + ", a day out on EKKA Show Day?";

  /* ---------- marquee bulbs ---------- */
  var bulbWrap = document.querySelector(".bulbs");
  for (var b=0; b<14; b++){ var i=document.createElement("i"); i.style.animationDelay=(b*0.12)+"s"; bulbWrap.appendChild(i); }

  /* ---------- answer state ---------- */
  var A = {
    email:"", day:"", swapDate:"", time:"", meal:"", cuisine:"",
    pets:"", petPlan:"", diet:"", activities:[], tryNew:"", notes:""
  };

  var CUISINES = ["Italian","Thai","Japanese","Vietnamese","Chinese","Indian","Modern Australian","Korean","Greek","Mexican"];
  var DIETS = [["Vegetarian","🥕"],["Vegan","🌱"],["Pescatarian","🐟"],["Fruitarian","🍓"],["Keto","🥑"],["Gluten free","🌾"],["None","🍽️"]];
  var ACTS = [["Movies","🎬"],["Botanical gardens","🌿"],["Zoo","🦁"],["Hiking / easy trail","🥾"],["Brisbane Royal Showgrounds","🎡"],["Theme parks","🎢"],["Beach","🏖️"],["Picnic","🧺"]];

  /* meal type depends on the chosen time block */
  function mealWord(){ return A.time === "morning" ? "lunch" : "dinner"; }

  /* ---------- flow (conditional) ---------- */
  function flow(){
    var s = ["email","ask","day"];
    if (A.day === "swapped") s.push("swapDate");
    s.push("time","meal");
    if (A.meal === "yes") s.push("cuisine");
    s.push("pets");
    if (A.pets === "yes") s.push("petPlan");
    s.push("diet","activities","notes","reminders","finish");
    return s;
  }
  var pos = 0;

  var stub = document.getElementById("stub");
  var progress = document.getElementById("progress");

  function drawProgress(){
    var f = flow(); progress.innerHTML = "";
    for (var k=0;k<f.length;k++){ var d=document.createElement("i"); if(k<=pos) d.className="on"; progress.appendChild(d); }
  }

  function go(delta){
    var f = flow();
    pos += delta;
    if (pos < 0) pos = 0;
    if (pos >= f.length) pos = f.length-1;
    render();
  }
  function goStep(id){ var f=flow(); var idx=f.indexOf(id); if(idx>=0){ pos=idx; render(); } }

  function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  var hey = NAME ? (NAME) : "you";

  /* ---------- renderers ---------- */
  function render(){
    var f = flow();
    if (pos >= f.length) pos = f.length-1;
    var id = f[pos];
    drawProgress();
    if (RENDER[id]) RENDER[id]();
    stub.scrollIntoView({block:"nearest"});
  }

  function backBtn(){
    return pos>0 ? '<button class="btn btn-ghost" data-back>Back</button>' : '';
  }

  var RENDER = {};

  RENDER.email = function(){
    stub.innerHTML =
      '<p class="steplabel">First, the important bit</p>'+
      '<h2 class="q">Where do I send the calendar invite?</h2>'+
      '<p class="hint">Pop your email in so the day can land straight in your calendar. That\'s the only thing I need up front.</p>'+
      '<div class="field"><input type="email" id="email" inputmode="email" autocomplete="email" placeholder="you@email.com" value="'+esc(A.email)+'"></div>'+
      '<div class="nav">'+backBtn()+'<button class="btn btn-primary" id="next" disabled>Next</button></div>';
    var em = document.getElementById("email");
    var nx = document.getElementById("next");
    function valid(){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em.value.trim()); }
    function upd(){ nx.disabled = !valid(); }
    em.addEventListener("input", upd); upd();
    em.addEventListener("keydown", function(e){ if(e.key==="Enter" && valid()){ A.email=em.value.trim(); go(1);} });
    nx.addEventListener("click", function(){ if(valid()){ A.email=em.value.trim(); go(1);} });
    wireBack();
  };

  RENDER.ask = function(){
    stub.innerHTML =
      '<div class="ask">'+
        '<p class="steplabel">The actual question</p>'+
        '<h2 class="q" style="font-size:clamp(1.5rem,6.4vw,2rem)">'+ (NAME? esc(NAME)+', ':'') +'will you come on a day trip with me on EKKA Show Day?</h2>'+
        '<p class="hint" style="text-align:center">Fair warning: this ticket doesn\'t come with a "no". 🎠</p>'+
        '<div class="yesno">'+
          '<button id="yesBtn">Yes! 🎉</button>'+
          '<button id="noBtn">No</button>'+
        '</div>'+
      '</div>';
    var yes = document.getElementById("yesBtn");
    var no  = document.getElementById("noBtn");
    var dodges = 0;
    var taunts = ["No","Nice try 😄","Nope, can\'t","Too slow!","Catch me!","Really? 🙃","Not today","Hah!"];

    function dodge(){
      dodges++;
      no.classList.add("loose");
      var pad = 12;
      var w = no.offsetWidth || 90, h = no.offsetHeight || 54;
      var maxX = Math.max(pad, window.innerWidth  - w - pad);
      var maxY = Math.max(pad, window.innerHeight - h - pad);
      var x = Math.random()*(maxX-pad)+pad;
      var y = Math.random()*(maxY-pad)+pad;
      no.style.left = x+"px"; no.style.top = y+"px";
      no.textContent = taunts[Math.min(dodges, taunts.length-1)];
      yes.style.transform = "scale(" + Math.min(1 + dodges*0.06, 1.6) + ")";
    }
    ["mouseenter","mouseover","pointerdown","touchstart","focus","click"].forEach(function(ev){
      no.addEventListener(ev, function(e){ e.preventDefault(); dodge(); }, {passive:false});
    });
    yes.addEventListener("click", function(){ celebrate(); setTimeout(function(){ go(1); }, 650); });
    wireBack();
  };

  RENDER.day = function(){
    stub.innerHTML =
      '<p class="steplabel">A quick consideration</p>'+
      '<h2 class="q">Is it still Show Day — Wed 12 Aug 2026?</h2>'+
      '<p class="hint">Some workplaces let you swap the EKKA public holiday for another day. Which is it for you?</p>'+
      '<div class="opts">'+
        optRow("day","same","📅","Still the same — Wed 12 August 2026")+
        optRow("day","swapped","🔁","I swapped my Show Day to a different date")+
      '</div>'+
      '<div class="nav">'+backBtn()+'<button class="btn btn-primary" id="next" '+(A.day?'':'disabled')+'>Next</button></div>';
    wireOpts("day", function(){ document.getElementById("next").disabled=false; });
    wireNext(); wireBack();
  };

  RENDER.swapDate = function(){
    stub.innerHTML =
      '<p class="steplabel">Your swapped day</p>'+
      '<h2 class="q">Which date works instead?</h2>'+
      '<p class="hint">Pick the day you\'ll take off — I\'ll set the calendar invite to match.</p>'+
      '<div class="field"><input type="date" id="swap" value="'+esc(A.swapDate)+'"></div>'+
      '<div class="nav">'+backBtn()+'<button class="btn btn-primary" id="next" '+(A.swapDate?'':'disabled')+'>Next</button></div>';
    var d = document.getElementById("swap");
    d.addEventListener("input", function(){ A.swapDate=d.value; document.getElementById("next").disabled=!d.value; });
    wireNext(); wireBack();
  };

  RENDER.time = function(){
    stub.innerHTML =
      '<p class="steplabel">How much of the day?</p>'+
      '<h2 class="q">Pick your time block</h2>'+
      '<p class="hint">However much suits you — no pressure either way.</p>'+
      '<div class="opts">'+
        optRow("time","morning","🌅","Half day — morning · 8am–3pm")+
        optRow("time","afternoon","🌇","Half day — afternoon · 11am–6pm")+
        optRow("time","full","☀️","Full day · 8am–6pm")+
      '</div>'+
      '<div class="nav">'+backBtn()+'<button class="btn btn-primary" id="next" '+(A.time?'':'disabled')+'>Next</button></div>';
    wireOpts("time", function(){ A.meal=""; A.cuisine=""; document.getElementById("next").disabled=false; });
    wireNext(); wireBack();
  };

  RENDER.meal = function(){
    var word = mealWord();
    stub.innerHTML =
      '<p class="steplabel">Add-on</p>'+
      '<h2 class="q">Fancy '+word+' too?</h2>'+
      '<p class="hint">'+ (word==="lunch"
          ? "Since it\'s a morning out, we could grab a bite around midday."
          : "We could round the day off with a proper feed.") +'</p>'+
      '<div class="opts">'+
        optRow("meal","yes","🍽️","Yes please — let\'s do "+word)+
        optRow("meal","no","🙂","No thanks, just the day out")+
      '</div>'+
      '<div class="nav">'+backBtn()+'<button class="btn btn-primary" id="next" '+(A.meal?'':'disabled')+'>Next</button></div>';
    wireOpts("meal", function(){ if(A.meal==="no") A.cuisine=""; document.getElementById("next").disabled=false; });
    wireNext(); wireBack();
  };

  RENDER.cuisine = function(){
    var word = mealWord();
    var rows = CUISINES.map(function(c){ return optRow("cuisine", c, "", c); }).join("");
    stub.innerHTML =
      '<p class="steplabel">For '+word+'</p>'+
      '<h2 class="q">What cuisine are you feeling?</h2>'+
      '<p class="hint">Ten of Brisbane\'s finest. Pick whatever your tastebuds fancy.</p>'+
      '<div class="opts">'+rows+'</div>'+
      '<div class="nav">'+backBtn()+'<button class="btn btn-primary" id="next" '+(A.cuisine?'':'disabled')+'>Next</button></div>';
    wireOpts("cuisine", function(){ document.getElementById("next").disabled=false; });
    wireNext(); wireBack();
  };

  RENDER.pets = function(){
    stub.innerHTML =
      '<p class="steplabel">The furry (or feathered) ones</p>'+
      '<h2 class="q">Do you have any pets?</h2>'+
      '<p class="hint">Just so we can plan the day around them if we need to.</p>'+
      '<div class="opts">'+
        optRow("pets","yes","🐾","Yes, I\'ve got a pet (or a few)")+
        optRow("pets","no","🚫","Nope, no pets")+
      '</div>'+
      '<div class="nav">'+backBtn()+'<button class="btn btn-primary" id="next" '+(A.pets?'':'disabled')+'>Next</button></div>';
    wireOpts("pets", function(){ if(A.pets==="no") A.petPlan=""; document.getElementById("next").disabled=false; });
    wireNext(); wireBack();
  };

  RENDER.petPlan = function(){
    stub.innerHTML =
      '<p class="steplabel">Your pets</p>'+
      '<h2 class="q">Leave them home, or bring them along?</h2>'+
      '<p class="hint">Whatever they\'d be happiest with.</p>'+
      '<div class="opts">'+
        optRow("petPlan","bring","🐕","Bring them with us")+
        optRow("petPlan","leave","🏠","Leave them cosy at home")+
      '</div>'+
      '<div class="nav">'+backBtn()+'<button class="btn btn-primary" id="next" '+(A.petPlan?'':'disabled')+'>Next</button></div>';
    wireOpts("petPlan", function(){ document.getElementById("next").disabled=false; });
    wireNext(); wireBack();
  };

  RENDER.diet = function(){
    var rows = DIETS.map(function(d){ return optRow("diet", d[0], d[1], d[0]); }).join("");
    stub.innerHTML =
      '<p class="steplabel">Good to know</p>'+
      '<h2 class="q">Any dietary requirements?</h2>'+
      '<p class="hint">So every bite of the day actually works for you.</p>'+
      '<div class="opts">'+rows+'</div>'+
      '<div class="nav">'+backBtn()+'<button class="btn btn-primary" id="next" '+(A.diet?'':'disabled')+'>Next</button></div>';
    wireOpts("diet", function(){ document.getElementById("next").disabled=false; });
    wireNext(); wireBack();
  };

  RENDER.activities = function(){
    var rows = ACTS.map(function(a){ return optRow("act", a[0], a[1], a[0], true); }).join("");
    stub.innerHTML =
      '<p class="steplabel">Pick up to 3</p>'+
      '<h2 class="q">What kind of day suits you?</h2>'+
      '<p class="hint">Choose up to three. And if nothing quite fits — tell me something you\'ve always wanted to try.</p>'+
      '<div class="opts">'+rows+'</div>'+
      '<div class="field" style="margin-top:14px"><input type="text" id="trynew" maxlength="140" placeholder="Something you\'ve always wanted to try? (optional)" value="'+esc(A.tryNew)+'"></div>'+
      '<div class="nav">'+backBtn()+'<button class="btn btn-primary" id="next">Next</button></div>';
    // multi-select up to 3
    var opts = stub.querySelectorAll('.opt[data-group="act"]');
    function refresh(){
      opts.forEach(function(o){
        var v=o.getAttribute("data-val");
        var on=A.activities.indexOf(v)>=0;
        o.classList.toggle("sel",on);
        o.classList.toggle("disabled", !on && A.activities.length>=3);
      });
    }
    opts.forEach(function(o){
      o.addEventListener("click", function(){
        var v=o.getAttribute("data-val"); var idx=A.activities.indexOf(v);
        if(idx>=0){ A.activities.splice(idx,1); }
        else if(A.activities.length<3){ A.activities.push(v); }
        refresh();
      });
    });
    refresh();
    var t=document.getElementById("trynew");
    t.addEventListener("input", function(){ A.tryNew=t.value; });
    wireNext(); wireBack();
  };

  RENDER.notes = function(){
    stub.innerHTML =
      '<p class="steplabel">Over to you</p>'+
      '<h2 class="q">Anything else I should know?</h2>'+
      '<p class="hint">Allergies, a hard stop time, a wish, a warning — anything at all. Totally optional.</p>'+
      '<div class="field"><textarea id="notes" maxlength="600" placeholder="Type anything here…">'+esc(A.notes)+'</textarea></div>'+
      '<div class="nav">'+backBtn()+'<button class="btn btn-primary" id="next">Next</button></div>';
    var n=document.getElementById("notes");
    n.addEventListener("input", function(){ A.notes=n.value; });
    wireNext(); wireBack();
  };

  RENDER.reminders = function(){
    stub.innerHTML =
      '<p class="steplabel">A few little reminders</p>'+
      '<h2 class="q">Just bring these along 🎪</h2>'+
      '<p class="hint">No need to type anything — these are just notes to tuck in your pocket for the day.</p>'+
      '<ul class="reminders">'+
        '<li><span class="em">✨</span>Bring your quirky attitude.</li>'+
        '<li><span class="em">💭</span>Have a think: did you change your mind about anything in the last few years?<small>If yes — what was it, and why?</small></li>'+
        '<li><span class="em">🦸</span>And one for the road: if you had a superpower, what would it be — and why?</li>'+
      '</ul>'+
      '<div class="nav">'+backBtn()+'<button class="btn btn-primary" id="next">Almost done →</button></div>';
    wireNext(); wireBack();
  };

  /* ---------- finish: build calendar invite + email ---------- */
  function dateParts(){
    // returns {ymd:"20260812", label:"Wednesday, 12 August 2026"}
    var d;
    if (A.day === "swapped" && A.swapDate){ d = new Date(A.swapDate + "T00:00:00"); }
    else { d = new Date("2026-08-12T00:00:00"); }
    var y=d.getFullYear(), m=d.getMonth()+1, day=d.getDate();
    var pad=function(n){return (n<10?"0":"")+n;};
    var ymd = y+pad(m)+pad(day);
    var opts={weekday:"long", day:"numeric", month:"long", year:"numeric"};
    var label;
    try{ label = d.toLocaleDateString("en-AU", opts); }catch(e){ label = ymd; }
    return {ymd:ymd, label:label};
  }
  function timeRange(){
    if (A.time==="morning") return ["080000","150000","8am–3pm (half day, morning)"];
    if (A.time==="afternoon") return ["110000","180000","11am–6pm (half day, afternoon)"];
    return ["080000","180000","8am–6pm (full day)"];
  }

  function summaryLines(){
    var dp=dateParts(), tr=timeRange();
    var petTxt = A.pets==="no" ? "No pets" : (A.petPlan==="bring" ? "Has pets — bringing them along" : (A.petPlan==="leave" ? "Has pets — leaving them home" : "Has pets"));
    var mealTxt = A.meal==="yes" ? (mealWord().charAt(0).toUpperCase()+mealWord().slice(1)) + (A.cuisine? " — "+A.cuisine+" cuisine":"") : "No "+mealWord();
    var acts = A.activities.length ? A.activities.join(", ") : "—";
    return [
      "EKKA Show Day trip — answers"+(NAME?(" from "+NAME):""),
      "",
      "Email: " + (A.email||"—"),
      "Day: " + dp.label + (A.day==="swapped"?" (swapped Show Day)":""),
      "Time: " + tr[2],
      "Meal: " + mealTxt,
      "Pets: " + petTxt,
      "Dietary: " + (A.diet||"—"),
      "Day style (up to 3): " + acts,
      "Always wanted to try: " + (A.tryNew||"—"),
      "Anything else: " + (A.notes||"—")
    ];
  }

  function calendarURL(){
    var dp=dateParts(), tr=timeRange();
    var text = "EKKA Show Day Trip 🎡" + (NAME? (" — "+NAME+" & me"):"");
    var details = summaryLines().join("\n") + "\n\n(Sent from the EKKA day-trip invite.)";
    var guests = [A.email, HOST_EMAIL].filter(Boolean).join(",");
    var u = "https://calendar.google.com/calendar/render?action=TEMPLATE"
      + "&text=" + encodeURIComponent(text)
      + "&dates=" + dp.ymd+"T"+tr[0] + "/" + dp.ymd+"T"+tr[1]
      + "&ctz=Australia/Brisbane"
      + "&details=" + encodeURIComponent(details)
      + "&location=" + encodeURIComponent("Brisbane, QLD")
      + "&add=" + encodeURIComponent(guests);
    return u;
  }
  function mailtoURL(){
    var subj = "EKKA Show Day trip"+(NAME?(" — "+NAME+"'s answers"):" — my answers");
    var body = summaryLines().join("\n");
    return "mailto:"+encodeURIComponent(HOST_EMAIL)+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(body);
  }

  RENDER.finish = function(){
    var dp=dateParts(), tr=timeRange();
    stub.innerHTML =
      '<div class="ask">'+
      '<p class="steplabel">That\'s everything 🎉</p>'+
      '<h2 class="q">You\'re all set'+(NAME?(", "+esc(NAME)):"")+'!</h2>'+
      '<p class="hint" style="text-align:center">Here\'s the plan: <b>'+esc(dp.label)+'</b>, '+esc(tr[2])+'.<br>Tap below to send your answers straight into the calendar invite.</p>'+
      '<div style="display:flex;flex-direction:column;gap:12px;margin-top:18px">'+
        '<button class="btn btn-primary" id="cal" style="box-shadow:0 6px 0 #8a1729">📅 Send it — add to Google Calendar</button>'+
        '<button class="btn btn-gold" id="mail">✉️ Send my answers by email instead</button>'+
      '</div>'+
      '<p class="hint" style="text-align:center;margin-top:14px">Your answers go to me so I can lock in the day. Can\'t wait 🍓</p>'+
      '<div class="nav" style="justify-content:center">'+backBtn()+'</div>'+
      '</div>';
    document.getElementById("cal").addEventListener("click", function(){ celebrate(); window.open(calendarURL(), "_blank", "noopener"); });
    document.getElementById("mail").addEventListener("click", function(){ window.location.href = mailtoURL(); });
    wireBack();
    celebrate();
  };

  /* ---------- shared wiring helpers ---------- */
  function optRow(group, val, em, label, multi){
    var sel = (!multi && A[group]===val) ? " sel" : "";
    return '<div class="opt'+sel+'" data-group="'+group+'" data-val="'+esc(val)+'" role="button" tabindex="0">'+
             (em?'<span class="em">'+em+'</span>':'<span class="em">•</span>')+
             '<span>'+esc(label)+'</span>'+
           '</div>';
  }
  function wireOpts(group, after){
    var opts = stub.querySelectorAll('.opt[data-group="'+group+'"]');
    function choose(o){
      A[group]=o.getAttribute("data-val");
      opts.forEach(function(x){ x.classList.toggle("sel", x===o); });
      if(after) after();
    }
    opts.forEach(function(o){
      o.addEventListener("click", function(){ choose(o); });
      o.addEventListener("keydown", function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); choose(o); } });
    });
  }
  function wireNext(){
    var n=document.getElementById("next");
    if(n) n.addEventListener("click", function(){ if(!n.disabled) go(1); });
  }
  function wireBack(){
    var b=stub.querySelector("[data-back]");
    if(b) b.addEventListener("click", function(){
      // clean up any loose NO button before leaving the ask screen
      go(-1);
    });
  }

  /* ---------- confetti ---------- */
  function celebrate(){
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var colors=["#e8384f","#ffcb47","#ff8fb1","#39c47b","#7aa8ff","#fff"];
    for(var i=0;i<80;i++){
      (function(){
        var c=document.createElement("div"); c.className="confetti";
        c.style.left=(Math.random()*100)+"vw";
        c.style.background=colors[Math.floor(Math.random()*colors.length)];
        c.style.transform="rotate("+(Math.random()*360)+"deg)";
        var dur=2.6+Math.random()*1.8, delay=Math.random()*0.4;
        c.animate([
          {transform:"translateY(-10px) rotate(0deg)", opacity:1},
          {transform:"translateY("+ (window.innerHeight+40) +"px) rotate("+(Math.random()*720-360)+"deg)", opacity:.9}
        ], {duration:dur*1000, delay:delay*1000, easing:"cubic-bezier(.3,.7,.5,1)"});
        document.body.appendChild(c);
        setTimeout(function(){ c.remove(); }, (dur+delay)*1000+80);
      })();
    }
  }

  render();
})();
</script>
</body>
</html>
